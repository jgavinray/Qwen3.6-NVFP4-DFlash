# Qwen3.6-27B Text NVFP4 + DFlash on RTX PRO 6000
#
# Default layout:
#   ${QWEN36_27B_MODELS_DIR:-/opt/qwen36-27b}/qwen36-27b-text-nvfp4
#   ${QWEN36_27B_MODELS_DIR:-/opt/qwen36-27b}/qwen36-27b-dflash

services:
  vllm:
    image: vllm-rtx6000-qwen36-27b:v0.1
    container_name: vllm-qwen36-27b-rtx6000
    restart: unless-stopped
    network_mode: host
    ipc: host
    environment:
      - VLLM_ALLOW_LONG_MAX_MODEL_LEN=1
      - TORCH_MATMUL_PRECISION=high
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - NVIDIA_FORWARD_COMPAT=1
      - HF_TOKEN=${HF_TOKEN:-}
      - HF_HUB_ENABLE_HF_TRANSFER=1
    volumes:
      - ${QWEN36_27B_MODELS_DIR:-/opt/qwen36-27b}/qwen36-27b-text-nvfp4:/models/qwen36-27b:ro
      - ${QWEN36_27B_MODELS_DIR:-/opt/qwen36-27b}/qwen36-27b-dflash:/models/qwen36-27b-dflash:ro
    command:
      - bash
      - -c
      - |
        exec vllm serve /models/qwen36-27b \
          --served-model-name qwen36-27b qwen36-27b-fast qwen36-27b-deep \
          --host 0.0.0.0 --port 8000 \
          --tensor-parallel-size 1 \
          --dtype auto \
          --quantization modelopt \
          --language-model-only \
          --max-model-len 262144 \
          --max-num-seqs 2 \
          --max-num-batched-tokens 32768 \
          --gpu-memory-utilization 0.90 \
          --enable-chunked-prefill \
          --enable-prefix-caching \
          --load-format safetensors \
          --trust-remote-code \
          --reasoning-parser qwen3 \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_coder \
          --default-chat-template-kwargs '{"enable_thinking": false}' \
          --speculative-config '{"method":"dflash","model":"/models/qwen36-27b-dflash","num_speculative_tokens":15}' \
          --attention-backend flash_attn
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
